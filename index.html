<!DOCTYPE html>
<html>

<head>
    <title>OoruVaani</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
</head>

<body>

    <!-- LOGIN / SIGN UP -->
    <div id="authBox">

        <h1>🏡 OoruVaani</h1>

        <h2>🔐 Sign In / Sign Up</h2>

        <input type="email"
               id="loginEmail"
               placeholder="📧 Email">

        <br><br>

        <input type="password"
               id="loginPassword"
               placeholder="🔑 Password">

        <br><br>

        <button onclick="loginUser()">
            🔐 Sign In
        </button>

        <button onclick="signupUser()">
            📝 Sign Up
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- APP CONTENT -->
    <div id="appContent" style="display:none;">

        <h1>🏡 OoruVaani</h1>

        <div class="welcome-card">

            <h2>👋 Welcome to OoruVaani</h2>

            <p>Mana Ooru • Mana Samacharam • Mana Sahayam</p>

            <p>
                Jobs, Farmers, Emergency & Local Updates —
                all in one place.
            </p>

        </div>

        <hr>

        <input
            type="text"
            id="searchBox"
            placeholder="🔎 Search here..."
            onkeypress="if(event.key === 'Enter') searchVillage()"
        >

        <button onclick="clearSearch()">
            ❌ Clear
        </button>

        <button onclick="searchVillage()">
            🔍 Search
        </button>

        <br><br>

        <button class="home-button jobs-button"
                onclick="window.location.href='jobs.html'">
            💼 Jobs
        </button>

        <button class="home-button farmers-button"
                onclick="window.location.href='farmers.html'">
            🌾 Farmers
        </button>

        <button class="home-button emergency-button"
                onclick="window.location.href='emergency.html'">
            🏥 Emergency Help
        </button>

        <button class="home-button updates-button"
                onclick="window.location.href='updates.html'">
            📢 Local Updates
        </button>

        <br><br>

        <button onclick="logoutUser()">
            🚪 Logout
        </button>

        <footer class="footer">
            <p>© 2026 OoruVaani</p>
            <p>🏠 Mana Ooru • Mana Information</p>
        </footer>

    </div>


<script>

    // 🔥 SAME FIREBASE CONFIG FROM YOUR BLOOD.HTML
    const firebaseConfig = {
        apiKey: "AIzaSyAHcDJvfVnqo36ICUCjSG8dz6GODXBJAq0",
        authDomain: "manaooru-18af9.firebaseapp.com",
        projectId: "manaooru-18af9",
        storageBucket: "manaooru-18af9.firebasestorage.app",
        messagingSenderId: "147443654207",
        appId: "1:147443654207:web:032c405abb71f73e54228a"
    };

    firebase.initializeApp(firebaseConfig);


    // 🔐 SIGN IN
    function loginUser() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const message =
            document.getElementById("loginMessage");


        if (!email || !password) {

            message.innerText =
                "Email and Password enter cheyyandi ❗";

            return;
        }


        firebase.auth()
            .signInWithEmailAndPassword(email, password)

            .then(() => {

                message.innerText =
                    "Login successful ✅";

            })

            .catch((error) => {

                message.innerText =
                    "Login failed ❌ " + error.message;

            });
    }


    // 📝 SIGN UP
    function signupUser() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const message =
            document.getElementById("loginMessage");


        if (!email || !password) {

            message.innerText =
                "Email and Password enter cheyyandi ❗";

            return;
        }


        firebase.auth()
            .createUserWithEmailAndPassword(email, password)

            .then(() => {

                message.innerText =
                    "Account created successfully ✅";

            })

            .catch((error) => {

                message.innerText =
                    "Sign Up failed ❌ " + error.message;

            });
    }


    // 🚪 LOGOUT
    function logoutUser() {

        firebase.auth()
            .signOut()

            .then(() => {

                document.getElementById("loginMessage")
                    .innerText =
                    "Logged out successfully ✅";

            });
    }


    // 🔐 AUTH CHECK
    firebase.auth().onAuthStateChanged(function(user) {

        const authBox =
            document.getElementById("authBox");

        const appContent =
            document.getElementById("appContent");


        if (user) {

            // LOGIN AYYINDI
            authBox.style.display = "none";
            appContent.style.display = "block";

        } else {

            // LOGIN AVVALEDU
            authBox.style.display = "block";
            appContent.style.display = "none";

        }

    });


    // 🔍 SEARCH
    function searchVillage() {

        let search =
            document.getElementById("searchBox")
            .value.toLowerCase().trim();


        if (search === "") {

            alert("Please enter something to search");

        }

        else if (
            search.includes("job") ||
            search.includes("jobs") ||
            search.includes("work")
        ) {

            window.location.href = "jobs.html";

        }

        else if (
            search.includes("farmer") ||
            search.includes("farming") ||
            search.includes("crop")
        ) {

            window.location.href = "farmers.html";

        }

        else if (
            search.includes("emergency") ||
            search.includes("hospital") ||
            search.includes("ambulance")
        ) {

            window.location.href = "emergency.html";

        }

        else if (
            search.includes("update") ||
            search.includes("updates") ||
            search.includes("news")
        ) {

            window.location.href = "updates.html";

        }

        else {

            alert("No information found");

        }
    }


    // ❌ CLEAR SEARCH
    function clearSearch() {

        document.getElementById("searchBox").value = "";

    }

</script>
    <a href="OoruVaani.apk" download style="display:block;text-align:center;margin:20px auto;padding:14px;background:#2563eb;color:white;text-decoration:none;border-radius:10px;font-weight:bold;">📱 Download OoruVaani App</a>

</body>

</html>
