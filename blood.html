<!DOCTYPE html>
<html>

<head>
    <title>OoruVaani - Blood Donors</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
</head>

<body>

    <!-- 🔐 Login Section -->
    <div id="loginBox">

        <h2>🔐 OoruVaani Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <br><br>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <br><br>

        <button onclick="loginUser()">
            🔐 Login
        </button>

        <button onclick="signupUser()">
            📝 Create Account
        </button>

        <button onclick="logoutUser()">
            🚪 Logout
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- 🩸 Page Heading -->

    <h1>🩸 OoruVaani Blood Donors</h1>

    <p>
        🏡 OoruVaani - Mana Ooru • Mana Samacharam • Mana Sahayam
    </p>

    <hr>


    <!-- 🔍 Search Donor -->

    <h2>🩸 Find a Blood Donor</h2>

    <select id="bloodGroup">

        <option value="">
            🩸 Select Blood Group
        </option>

        <option value="A+">A+</option>
        <option value="A-">A-</option>

        <option value="B+">B+</option>
        <option value="B-">B-</option>

        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>

        <option value="O+">O+</option>
        <option value="O-">O-</option>

    </select>

    <br><br>

    <button
        id="searchDonorBtn"
        onclick="searchDonor()"
    >
        🔍 Search Donor
    </button>

    <button onclick="clearDonorResults()">
        ❌ Clear Results
    </button>


    <hr>


    <!-- 📝 Register Donor -->

    <h2>📝 Register as Blood Donor</h2>

    <input
        type="text"
        id="donorName"
        placeholder="👤 Your Name"
    >

    <br><br>

    <input
        type="text"
        id="donorVillage"
        placeholder="🏠 Village"
    >

    <br><br>

    <input
        type="tel"
        id="donorPhone"
        placeholder="📞 Phone Number"
    >

    <br><br>


    <!-- 🔢 Donor Count -->

    <h3 id="donorCount">
        🩸 Registered Donors: 0
    </h3>


    <button
        id="registerDonorBtn"
        onclick="registerDonor()"
    >
        🩸 Register as Donor
    </button>


    <!-- 📋 Search Results -->

    <div id="donorResult"></div>


    <br><br>


    <!-- Navigation -->

    <button onclick="history.back()">
        ⬅️ Back
    </button>

    <button onclick="window.location.href='index.html'">
        🏠 Home
    </button>



<script>


/* =========================================================
   🔥 FIREBASE CONFIGURATION
   ========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAHcDJvfVnqo36ICUCjSG8dz6GODXBJAq0",

    authDomain: "manaooru-18af9.firebaseapp.com",

    projectId: "manaooru-18af9",

    storageBucket: "manaooru-18af9.firebasestorage.app",

    messagingSenderId: "147443654207",

    appId: "1:147443654207:web:032c405abb71f73e54228a"

};


/* =========================================================
   🔥 START FIREBASE
   ========================================================= */

firebase.initializeApp(firebaseConfig);


/* =========================================================
   🗄️ FIRESTORE
   ========================================================= */

const db = firebase.firestore();



/* =========================================================
   🔐 LOGIN
   ========================================================= */

function loginUser() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "Email and Password enter cheyyandi ❗";

        return;
    }


    firebase.auth()
        .signInWithEmailAndPassword(email, password)

        .then(() => {

            message.innerText =
                "Login successful ✅";

        })

        .catch((error) => {

            console.error(error);

            message.innerText =
                "Login failed ❌ " + error.message;

        });

}



/* =========================================================
   📝 CREATE ACCOUNT
   ========================================================= */

function signupUser() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "Email and Password enter cheyyandi ❗";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "Password minimum 6 characters undali ❗";

        return;
    }


    firebase.auth()
        .createUserWithEmailAndPassword(email, password)

        .then(() => {

            message.innerText =
                "Account created successfully ✅";

        })

        .catch((error) => {

            console.error(error);

            message.innerText =
                "Sign Up failed ❌ " + error.message;

        });

}



/* =========================================================
   🚪 LOGOUT
   ========================================================= */

function logoutUser() {

    firebase.auth()
        .signOut()

        .then(() => {

            document.getElementById(
                "loginMessage"
            ).innerText =
                "Logged out successfully ✅";

        })

        .catch((error) => {

            console.error(error);

            document.getElementById(
                "loginMessage"
            ).innerText =
                "Logout failed ❌ " + error.message;

        });

}



/* =========================================================
   👤 AUTH STATE
   ========================================================= */

firebase.auth().onAuthStateChanged(function(user) {


    const registerBtn =
        document.getElementById(
            "registerDonorBtn"
        );


    const searchBtn =
        document.getElementById(
            "searchDonorBtn"
        );


    const donorCount =
        document.getElementById(
            "donorCount"
        );


    const donorResult =
        document.getElementById(
            "donorResult"
        );


    if (user) {


        /* User logged in */

        registerBtn.disabled = false;

        searchBtn.disabled = false;


        donorCount.innerText =
            "🩸 Loading donor count...";


        updateDonorCount();


    } else {


        /* User logged out */

        registerBtn.disabled = true;

        searchBtn.disabled = true;


        donorCount.innerText =
            "🩸 Please login";


        donorResult.innerHTML = "";

    }

});



/* =========================================================
   🩸 REGISTER DONOR
   ========================================================= */

async function registerDonor() {


    const currentUser =
        firebase.auth().currentUser;


    if (!currentUser) {

        alert(
            "Please login first 🔐"
        );

        return;
    }


    const name =
        document.getElementById(
            "donorName"
        ).value.trim();


    const village =
        document.getElementById(
            "donorVillage"
        ).value.trim();


    const phone =
        document.getElementById(
            "donorPhone"
        ).value.trim();


    const group =
        document.getElementById(
            "bloodGroup"
        ).value;



    /* Validate */

    if (
        name === "" ||
        village === "" ||
        phone === "" ||
        group === ""
    ) {

        alert(
            "Please fill all donor details"
        );

        return;
    }



    try {


        await db
            .collection("donors")
            .add({

                name: name,

                village: village,

                phone: phone,

                group: group,

                userId: currentUser.uid

            });



        alert(
            "Thank you " +
            name +
            "! Donor registered successfully. ❤️"
        );



        /* Clear form */

        document.getElementById(
            "donorName"
        ).value = "";


        document.getElementById(
            "donorVillage"
        ).value = "";


        document.getElementById(
            "donorPhone"
        ).value = "";


        document.getElementById(
            "bloodGroup"
        ).value = "";



        updateDonorCount();


    } catch (error) {


        console.error(error);


        alert(
            "Donor registration failed: " +
            error.message
        );

    }

}



/* =========================================================
   🔍 SEARCH DONOR
   ========================================================= */

async function searchDonor() {


    const currentUser =
        firebase.auth().currentUser;


    if (!currentUser) {

        alert(
            "Please login first 🔐"
        );

        return;
    }


    const group =
        document.getElementById(
            "bloodGroup"
        ).value;



    if (group === "") {

        alert(
            "Please select blood group"
        );

        return;
    }



    try {


        const snapshot =
            await db
                .collection("donors")
                .get();



        const matchingDonors = [];



        snapshot.forEach(function(item) {


            const donor =
                item.data();



            if (donor.group === group) {


                matchingDonors.push({

                    id: item.id,

                    ...donor

                });

            }

        });



        /* No donors */

        if (matchingDonors.length === 0) {


            document.getElementById(
                "donorResult"
            ).innerHTML =
                "<p>❌ No " +
                group +
                " blood donors found.</p>";


            return;
        }



        /* Result heading */

        let result =
            "<h3>🩸 " +
            group +
            " Blood Donors</h3>";



        /* Donor list */

        matchingDonors.forEach(
            function(donor) {


                let deleteButton = "";



                /* Only owner can delete */

                if (
                    donor.userId ===
                    currentUser.uid
                ) {


                    deleteButton =
                        "<button onclick=\"deleteDonor('" +
                        donor.id +
                        "')\">" +
                        "🗑️ Delete" +
                        "</button>";

                }



                result +=

                    "<p>👤 Name: " +
                    donor.name +
                    "</p>" +

                    "<p>🏠 Village: " +
                    donor.village +
                    "</p>" +

                    "<p>📞 Phone: " +
                    donor.phone +
                    "</p>" +

                    deleteButton +

                    "<hr>";

            }
        );



        document.getElementById(
            "donorResult"
        ).innerHTML = result;



    } catch (error) {


        console.error(error);


        alert(
            "Donor search failed: " +
            error.message
        );

    }

}



/* =========================================================
   🗑️ DELETE DONOR
   ========================================================= */

async function deleteDonor(id) {


    const currentUser =
        firebase.auth().currentUser;


    if (!currentUser) {

        alert(
            "Please login first 🔐"
        );

        return;
    }



    try {


        await db
            .collection("donors")
            .doc(id)
            .delete();



        alert(
            "Donor deleted successfully ✅"
        );



        updateDonorCount();



        /* Refresh results */

        searchDonor();



    } catch (error) {


        console.error(error);


        alert(
            "Donor delete failed: " +
            error.message
        );

    }

}



/* =========================================================
   🔢 DONOR COUNT
   ========================================================= */

async function updateDonorCount() {


    const currentUser =
        firebase.auth().currentUser;


    if (!currentUser) {


        document.getElementById(
            "donorCount"
        ).innerText =
            "🩸 Please login";


        return;
    }



    try {


        const snapshot =
            await db
                .collection("donors")
                .get();



        document.getElementById(
            "donorCount"
        ).innerText =
            "🩸 Registered Donors: " +
            snapshot.size;



    } catch (error) {


        console.error(error);


        document.getElementById(
            "donorCount"
        ).innerText =
            "🩸 Registered Donors: 0";

    }

}



/* =========================================================
   ❌ CLEAR SEARCH RESULTS
   ========================================================= */

function clearDonorResults() {


    document.getElementById(
        "donorResult"
    ).innerHTML = "";


    document.getElementById(
        "bloodGroup"
    ).value = "";

}



/* =========================================================
   🔢 INITIAL DONOR COUNT
   ========================================================= */

updateDonorCount();


</script>

</body>

</html>
